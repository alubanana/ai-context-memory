</style></head><body><header><span class="brand">AI助手 · 记忆与知识管理</span><span class="badge">合成示例 / 科普阅读器</span></header><main><h1>上下文连续性</h1><nav aria-label="运行阶段"></nav><div class="stats" id="stats"></div><div class="layout"><section class="panel"><h2>来源版本</h2><div id="records"></div></section><aside class="panel"><h2>当前主题</h2><div class="source"><p>第一阶段验证来源追溯，摘要风格比较在第二阶段进行。</p></div><h2>处理流程</h2><div class="flow"><span>原文</span>→<span>增量索引</span>→<span>版本队列</span>→<span>核读签收</span>→<span>主题状态</span></div><div class="check" id="check"></div></aside></div></main><script type="application/json" id="demo-data">{"title": "个人AI助手记忆与知识管理", "synthetic": true, "intake": {"files": 0, "unchanged": 1, "reset": 0, "inserted": 0, "duplicates": 0, "malformed": 0, "partial": 0, "recleaned": 0}, "oldReviewRejected": true, "stages": [{"name": "首次扫描", "report": {"checked_at": "2026-10-21T13:29:12.199487+00:00", "status": "requires_review", "since": "2026-01-01T00:00:00Z", "topic": null, "source_refresh_issue": null, "pending_count": 2, "by_owner": {"research": 2}, "sources": [{"id": "thread:11111111-1111-4111-8111-111111111111", "owner": "research", "title": "虚构的科普阅读器项目", "kind": "messages", "sha256": "869af78e828dac5b6bdb38a0dca78194f9190ccbf7b2e632ee44f3d4235849aa", "count": 1, "latest": "2026-01-02T09:00:00Z", "path": "memory/prompt-intake/11111111-1111-4111-8111-111111111111.md", "status": "requires_review", "reason": "not_reviewed", "last_reviewed_at": null, "disposition": null, "note": null}, {"id": "file:reading-plan", "owner": "research", "title": "阅读器研究计划", "kind": "file", "sha256": "f16fcaaf438360f7da456d4423ab6ca2f2365f9f0cf33e5e7491c0a51a5bb3e3", "path": "notes/research-plan.md", "missing": false, "status": "requires_review", "reason": "not_reviewed", "last_reviewed_at": null, "disposition": null, "note": null}], "scope": "配置中的消息与资料；新对话进入待分流。来源已索引不等于核读，核读不等于稳定人格结论。"}}, {"name": "核读签收", "report": {"checked_at": "2026-10-21T13:29:12.227893+00:00", "status": "current", "since
