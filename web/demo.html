<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人AI助手记忆与知识管理</title><style>
:root{--ink:#172a33;--muted:#637780;--blue:#176079;--line:#d9e3e7;--paper:#fff;--bg:#f4f7f8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:19px 5%;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.brand{font-weight:700}.badge{font-size:11px;color:var(--muted)}main{max-width:1240px;padding:40px 35px;margin:auto}h1{font-size:30px;font-weight:650;margin:0 0 25px}nav{display:flex;gap:8px;margin-bottom:30px}button{font:inherit;border:1px solid var(--line);background:white;color:var(--muted);padding:9px 20px;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:var(--blue);color:white;border-color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:25px}.stat{padding:20px 24px;border:1px solid var(--line);background:white;border-radius:8px}.stat small{color:var(--muted);font-size:12px}.stat b{display:block;font-size:35px;line-height:1.4;font-weight:600}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}.panel{background:white;border:1px solid var(--line);padding:24px;border-radius:8px}h2{font-size:16px;margin:0 0 20px}.record{padding:17px 0;border-top:1px solid var(--line)}.record-top{display:flex;justify-content:space-between;gap:10px}.record strong{font-size:14px}.record p{font-size:12px;color:var(--muted);margin:8px 0}.status{font-size:11px;color:#85641e;background:#fbf3da;padding:2px 7px;border-radius:4px;white-space:nowrap}.status.ok{background:#e9f3ed;color:#2b694b}code{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.source{padding:14px;background:#f4f7f8;border-left:3px solid #9bb7c3;margin-bottom:20px}.source p{font-size:13px;margin:0}.flow{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px}.flow span{padding:5px 10px;background:#f4f7f8;border-radius:3px}.check{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:#2b694b}footer{margin-top:25px;color:var(--muted);font-size:11px}@media(max-width:700px){main{padding:28px 20px}h1{font-size:24px}.layout{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:15px}.stat b{font-size:27px}nav button{padding:8px 12px;font-size:12px}.record-top{flex-wrap:wrap}.badge{max-width:100px}header{padding:15px 20px}}
</style></head><body><header><span class="brand">AI助手 · 记忆与知识管理</span><span class="badge">合成示例 / 科普阅读器</span></header><main><h1>上下文连续性</h1><nav aria-label="运行阶段"></nav><div class="stats" id="stats"></div><div class="layout"><section class="panel"><h2>来源版本</h2><div id="records"></div></section><aside class="panel"><h2>当前主题</h2><div class="source"><p>第一阶段验证来源追溯，摘要风格比较在第二阶段进行。</p></div><h2>处理流程</h2><div class="flow"><span>原文</span>→<span>增量索引</span>→<span>版本队列</span>→<span>核读签收</span>→<span>主题状态</span></div><div class="check" id="check"></div></aside></div></main><script type="application/json" id="demo-data">__DEMO_DATA__</script><script>
const DATA=JSON.parse(document.querySelector('#demo-data').textContent),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let stage=0;
function render(){const r=DATA.stages[stage].report;document.querySelector('nav').innerHTML=DATA.stages.map((s,i)=>'<button data-stage="'+i+'" aria-pressed="'+(i===stage)+'">'+esc(s.name)+'</button>').join('');document.querySelector('#stats').innerHTML=[['来源',r.sources.length],['待核读',r.pending_count],['已签收',r.sources.filter(s=>s.status==='reviewed').length]].map(([l,v])=>'<div class="stat"><small>'+l+'</small><b>'+v+'</b></div>').join('');document.querySelector('#records').innerHTML=r.sources.map(s=>'<article class="record"><div class="record-top"><strong>'+esc(s.title)+'</strong><span class="status '+(s.status==='reviewed'?'ok':'')+'">'+(s.status==='reviewed'?'已核读':'待核读')+'</span></div><p>'+esc(s.path)+'</p><code>SHA256 '+esc(s.sha256?.slice(0,20))+'…</code>'+(s.note?'<p>'+esc(s.note)+'</p>':'')+'</article>').join('');document.querySelector('#check').textContent=stage===2?'来源已更新 · 旧版本签收被拒绝':stage===1?'来源与状态输出版本一致':'发现 2 项待核读来源';}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(b){stage=Number(b.dataset.stage);render();}});render();
</script></body></html>
